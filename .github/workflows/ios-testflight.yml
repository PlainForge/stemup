# Builds the Flutter iOS app in mobile/ and uploads it to App Store Connect
# (TestFlight) whenever master changes something under mobile/.
#
# Signing is fully automatic: the archive is built unsigned, then the export step
# uses the App Store Connect API key to sign it with a cloud-managed distribution
# certificate and an App Store provisioning profile, so no .p12 or .mobileprovision
# files need to live in the repo or secrets, and no certificates pile up in the
# Apple Developer account from CI runs.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    App Store Connect issuer ID
#   ASC_KEY_P8       Full contents of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID    10-character Apple Developer team ID
# Optional repository variable:
#   BUILD_NUMBER_OFFSET  Added to the run number so builds stay above the last
#                        Capacitor build you uploaded (default 100).

name: iOS → TestFlight

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ vars.BUILD_NUMBER_OFFSET || 100 }} + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Prepare Xcode project
        # Generates Flutter's iOS build settings (version from pubspec, build number from CI).
        # --no-codesign skips Flutter's local certificate check; the runner has none until
        # the Archive step below creates/fetches one through the App Store Connect API key.
        run: flutter build ios --release --config-only --no-codesign --build-number="$BUILD_NUMBER"

      - name: Archive (unsigned)
        # Signing here would make Xcode create a new Apple Development certificate on
        # every run (each runner starts without one), which hits Apple's certificate
        # limit. The export step below does the real App Store signing instead, with
        # a cloud-managed distribution certificate that needs nothing on this machine.
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Carry the app's entitlements into the archive
        # The export re-signs the app using the entitlements it finds on it, so an unsigned
        # archive would lose Sign in with Apple and push notifications. A local ad-hoc
        # signature records them (Runner.entitlements); export replaces it with the real one.
        run: |
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          codesign --force --sign - --timestamp=none --entitlements ios/Runner/Runner.entitlements "$APP"
          echo "Entitlements on the archived app:"
          codesign -d --entitlements :- "$APP"

      - name: Export and upload to App Store Connect
        run: |
          plutil -replace teamID -string "${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Clean up API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
